<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COCOON 2027 | Page Title</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>

<!-- ================================================================
     TEMPLATE FOR A NEW PAGE
       1. Copy this file and rename it, e.g. student-travel-grants.html
          (lowercase, words joined by "-").
       2. Change "Page Title" in <title> and <h1>.
       3. Write the content as <section class="section"> ... </section>.
       4. Add the page to menu.js.
     This file starts with "_" so GitHub Pages does not publish it.
     ================================================================ -->

<header id="header"></header>   <!-- menu comes from menu.js -->

<div class="banner">
  <h1>Page Title</h1>
</div>

<main class="page">
  <div class="page-body">

    <section class="section">
      <h2>Section Title</h2>
      <p>A paragraph. <a href="https://example.org" target="_blank">A link</a>.</p>
      <ul>
        <li>A list item</li>
      </ul>
    </section>

    <section class="section">
      <h2>Section Title</h2>
      <table>
        <tr><th>Column</th><th>Column</th></tr>
        <tr><td>...</td><td>...</td></tr>
      </table>
    </section>

  </div>
</main>

<footer id="footer"></footer>
<script src="menu.js"></script>
</body>
</html>
